[project]
package-mode = false
name = "pythonproject"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
requires-python = ">=3.14,<4.0"
dependencies = [
    "speechrecognition (>=3.17.0,<4.0.0)",
    "pyttsx3 (>=2.99,<3.0)",
    "sounddevice (>=0.5.5,<0.6.0)",
    "numpy (>=2.5.0,<3.0.0)",
    "pandas (>=3.0.3,<4.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "loader (>=2017.9.11,<2018.0.0)",
    "pandas-stubs (>=3.0.3,<3.1.0)",
    "ursina (>=8.3.0,<9.0.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "customtkinter (>=6.0.0,<7.0.0)",
    "python-docx (>=1.2.0,<2.0.0)",
    "yt6 (>=1.5.5,<2.0.0)",
    "pyqt6 (>=6.11.0,<7.0.0)",
    "matplotlib (>=3.11.0,<4.0.0)",
    "python-pptx (>=1.0.2,<2.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=26.3.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "mypy (>=2.0.0,<3.0.0)"
]
dev = [
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-html (>=4.2.0,<5.0.0)"
]

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = 'venv'

[tool.black]
line-length = 119
exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | dist
  )/
  | foo.py
)
'''

[tool.isort]
line_length = 119

[tool.coverage.run]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
    "pass",
    "raise NotImplementedError",
]